# Runs the pytest suite on every push and pull request targeting `main`.
#
# The suite needs no external services: models/database.py falls back to
# an in-memory SQLite database whenever DATABASE_URL is unset, so no
# secrets or database provisioning are required here.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch/PR when a new commit
# lands, so CI minutes aren't spent on stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default token scope is read-only; this workflow only needs to check
# out code and report a status, so no elevated permissions are granted.
permissions:
  contents: read

jobs:
  pytest:
    name: Run test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    env:
      LOG_LEVEL: ERROR

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-py${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14
