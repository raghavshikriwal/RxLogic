name: Security Scans

on:
  push:
    branches: [main, task-12-security-hardening]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    name: Python dependency and static security scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and scan tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-security.txt

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Run Bandit static analysis
        run: bandit -q -r app.py extensions.py routes models services scripts -s B104

  frontend-security:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high
